catalogMode: prefer
ignoreWorkspaceRootCheck: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - playground
  - docs
  - packages/*
  - examples/*

catalog:
  '@antfu/eslint-config': ^7.4.3
  '@antfu/ni': ^28.2.0
  '@antfu/utils': ^9.3.0
  '@types/node': ^25.3.0
  bumpp: ^10.4.1
  cac: ^6.7.14
  chokidar: ^5.0.0
  eslint: ^10.0.0
  lint-staged: ^16.2.7
  pnpm: ^10.30.0
  scule: ^1.3.0
  simple-git-hooks: ^2.13.1
  taze: ^19.9.2
  tinyglobby: ^0.2.15
  tsdown: ^0.20.3
  tsx: ^4.21.0
  typescript: ^5.9.3
  vite: ^7.3.1
  vitest: ^4.0.18

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
